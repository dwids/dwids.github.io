site_name: David's SiC Blog 

site_url: https://dwids.github.io/

## Added material on 2026-04-26
theme:
  name: material

## Added search and tags on 2026-04-26
plugins:
  - search
  - tags:
      tags_file: tags.md
  - callouts
  - obsidian-bridge

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.tasklist
  - footnotes
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js