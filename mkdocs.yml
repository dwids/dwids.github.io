site_name: David's SiC Blog 

site_url: https://dwids.github.io/

theme:
  name: material
  palette:
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

  features:
    - navigation.top          # back to top button
    - navigation.indexes      # folder index pages
    - search.highlight        # highlights search terms in results
    - search.suggest          # search autocomplete
    - content.tooltips        # hover tooltips on links

## Added search and tags on 2026-04-26
plugins:
  - search
  - tags:
      tags_file: tags.md
  - callouts
  - obsidian-bridge

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.tasklist
  - footnotes
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
  
copyright: Copyright &copy; 2026 David Sidwell